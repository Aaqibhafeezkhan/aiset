[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiset"
version = "0.1.0"
description = "Turn your repositories into an AI engineering team, and watch it work."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aiset = "aiset.server:main"
teammap = "aiset.teammap:cli"
aiset-init = "aiset.init_team:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiset = ["roster.json", "teammap_ts.js", "static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
