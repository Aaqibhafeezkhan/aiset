name: Bug report
description: Something in Aiset doesn't work as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search [existing issues](https://github.com/JamshidS/aiset/issues) first.
        **Security problem?** Don't file it here; follow [SECURITY.md](https://github.com/JamshidS/aiset/blob/master/SECURITY.md).

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where did it happen?
      options:
        - Office dashboard
        - Brain view
        - Architecture view
        - Settings
        - aiset-init (team setup)
        - teammap (index / impact / relevant / failures / research)
        - Agent templates / instructions
        - Evaluation scripts
        - Docs
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran or the clicks you made, in order.
      placeholder: |
        1. aiset-init ~/work/shop --team shop
        2. aiset --workspace ~/work/shop
        3. Open Brain and ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      description: Paste tracebacks or terminal output. Remove anything private (paths, code, transcript content) first.
      render: shell

  - type: dropdown
    id: workspace
    attributes:
      label: Workspace shape
      options:
        - Folder of repositories
        - Monorepo
        - Single repository
        - Not relevant
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Aiset version or commit
      placeholder: "0.1.0 or a commit hash (git rev-parse --short HEAD)"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "python --version"
    validations:
      required: true

  - type: input
    id: other-versions
    attributes:
      label: Claude Code / Node.js / browser versions (if relevant)
      placeholder: "claude --version, node --version, Chrome 130"

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, workarounds you found, or related issues.
