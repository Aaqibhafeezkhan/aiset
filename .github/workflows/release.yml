name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the package, publishes it to PyPI as aiset-cli
# with trusted publishing (no token stored here), and attaches the files to the release.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'EOF'
          import os, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("src/aiset/__init__.py").read()).group(1)
          tag = os.environ["TAG"]
          assert tag == f"v{version}", f"tag {tag} != v{version} in pyproject.toml"
          assert init == version, f"src/aiset/__init__.py says {init}, pyproject.toml says {version}"
          print(f"releasing {version}")
          EOF
      - run: python -m pip install build==1.2.2.post1 twine==6.1.0
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aiset-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach:
    name: Attach files to the release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
