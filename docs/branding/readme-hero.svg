  <text x="64" y="138" fill="#a99ae9" font-size="12" font-weight="600" letter-spacing="3">SHARED MEMORY FOR CODING AGENTS</text>
  <text x="60" y="205" fill="#f5f3ff" font-size="52" font-weight="700" letter-spacing="-2">A shared brain.</text>
  <text x="60" y="267" fill="#f5f3ff" font-size="52" font-weight="700" letter-spacing="-2">A smarter next task.</text>
  <text x="64" y="319" fill="#b9b5d0" font-size="18">Keep the knowledge. Share the context.</text>
  <text x="64" y="347" fill="#b9b5d0" font-size="18">Spend less effort rediscovering your project.</text>
  <rect x="64" y="393" width="9" height="9" rx="3" fill="#57c7ce"/>
  <text x="84" y="402" fill="#d0cbe6" font-size="12" letter-spacing="1.5">LOCAL WORKSPACE · CLAUDE CODE · OPEN SOURCE</text>
</g>
