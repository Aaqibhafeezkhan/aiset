<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">aiset — A shared brain for your AI agents.</title>
<desc id="desc">Persistent knowledge connects your agents to rules, decisions, code and lessons, ready for the next task.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111329"/><stop offset="1" stop-color="#222044"/></linearGradient>
  <linearGradient id="line"><stop stop-color="#8d79ef"/><stop offset="1" stop-color="#57c7ce"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a9a1d9" opacity=".12"/></pattern>
</defs>
<rect width="1200" height="480" rx="24" fill="url(#bg)"/>
<rect width="1200" height="480" rx="24" fill="url(#grid)"/>
<path d="M0 464H1200" stroke="url(#line)" stroke-width="2" opacity=".6"/>
<g font-family="Segoe UI,Arial,sans-serif">
